<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sweet Snake</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101417;
        color: #ecf2f0;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(92vw, 560px);
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 14px;
      }

      h1 {
        margin: 0;
        font-size: 1.4rem;
        font-weight: 700;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 600;
      }

      button {
        border: 1px solid #6c8f83;
        border-radius: 6px;
        background: #18342c;
        color: #ecf2f0;
        padding: 8px 12px;
        font: inherit;
        cursor: pointer;
      }

      button:hover {
        background: #235346;
      }

      canvas {
        width: 100%;
        aspect-ratio: 1;
        display: block;
        border: 1px solid #2f4941;
        background: #0b0f11;
      }

      .hint {
        margin-top: 12px;
        color: #9fb3ad;
        font-size: 0.92rem;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Sweet Snake</h1>
        <div class="status">
          <span>Score: <span id="score">0</span></span>
          <button id="restart" type="button">Restart</button>
        </div>
      </header>
      <canvas id="board" width="520" height="520" aria-label="Snake game board"></canvas>
      <p class="hint" id="message">Use arrow keys or WASD to steer.</p>
    </main>

    <script type="module">
      import { changeDirection, createGame, restartGame, stepGame } from './game.js';

      const canvas = document.querySelector('#board');
      const context = canvas.getContext('2d');
      const score = document.querySelector('#score');
      const message = document.querySelector('#message');
      const restart = document.querySelector('#restart');
      const cellSize = canvas.width / 20;
      let game = createGame({ width: 20, height: 20 });
      let timer = null;

      const keyMap = {
        ArrowUp: 'up',
        w: 'up',
        W: 'up',
        ArrowDown: 'down',
        s: 'down',
        S: 'down',
        ArrowLeft: 'left',
        a: 'left',
        A: 'left',
        ArrowRight: 'right',
        d: 'right',
        D: 'right'
      };

      window.addEventListener('keydown', (event) => {
        const direction = keyMap[event.key];
        if (!direction) return;
        event.preventDefault();
        game = changeDirection(game, direction);
        render();
      });

      restart.addEventListener('click', () => {
        game = restartGame(game);
        start();
      });

      function start() {
        clearInterval(timer);
        message.textContent = 'Use arrow keys or WASD to steer.';
        timer = setInterval(() => {
          game = stepGame(game);
          render();
          if (game.gameOver) {
            clearInterval(timer);
            message.textContent = 'Game over. Press Restart to play again.';
          }
        }, 110);
        render();
      }

      function render() {
        context.clearRect(0, 0, canvas.width, canvas.height);
        drawGrid();
        drawCell(game.food, '#f2c14e');
        for (const [index, cell] of game.snake.entries()) {
          drawCell(cell, index === 0 ? '#47d18c' : '#2ea66f');
        }
        score.textContent = String(game.score);
      }

      function drawGrid() {
        context.strokeStyle = '#162126';
        context.lineWidth = 1;
        for (let index = 0; index <= 20; index += 1) {
          const offset = index * cellSize;
          context.beginPath();
          context.moveTo(offset, 0);
          context.lineTo(offset, canvas.height);
          context.stroke();
          context.beginPath();
          context.moveTo(0, offset);
          context.lineTo(canvas.width, offset);
          context.stroke();
        }
      }

      function drawCell(cell, fill) {
        context.fillStyle = fill;
        context.fillRect(cell.x * cellSize + 1, cell.y * cellSize + 1, cellSize - 2, cellSize - 2);
      }

      start();
    </script>
  </body>
</html>
